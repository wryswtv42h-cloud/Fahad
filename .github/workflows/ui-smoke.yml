name: MLD UI smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for Railway deployment
        run: |
          for i in {1..30}; do
            if curl -fsS https://discord-community-platform-production-9348.up.railway.app/ | grep -q "site.js?v=20260927-fix16"; then
              echo "Railway deployment is live"
              exit 0
            fi
            echo "Waiting for Railway deployment ($i/30)"
            sleep 5
          done
          echo "Timed out waiting for the new Railway deployment"
          exit 1
      - run: npx playwright test tests/site.spec.js --reporter=html,line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
