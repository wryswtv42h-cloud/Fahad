name: MLD 1000-user distributed peak
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  peak:
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for fully ready release
        run: |
          for i in {1..36}; do
            if curl -fsS https://discord-community-platform-production-9348.up.railway.app/health >/tmp/health.json && grep -q "hardening-6" /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Synchronize start
        run: sleep 8
      - name: Run 250 concurrent users on shard
        run: node tests/peak-shard.mjs
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
