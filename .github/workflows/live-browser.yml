name: Live browser regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Railway deployment
        run: sleep 60
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live site
        env:
          SITE_URL: https://fahad-production-012e.up.railway.app
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.SITE_URL;
          const failures = [];
          (async () => {
            for (const viewport of [{width:390,height:844,name:'mobile'},{width:1440,height:900,name:'desktop'}]) {
              const browser = await chromium.launch({headless:true});
              const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}, locale:'ar-SA'});
              page.on('pageerror', e => failures.push(viewport.name+' pageerror: '+e.message));
              page.on('console', m => { if (m.type()==='error') failures.push(viewport.name+' console: '+m.text()); });
              const health = await page.request.get(base+'/health');
              if (!health.ok()) throw new Error('health '+health.status());
              const gamesApi = await page.request.get(base+'/api/platform/games');
              if (!gamesApi.ok()) throw new Error('games api '+gamesApi.status());
              const games = await gamesApi.json();
              if (!Array.isArray(games.games) || games.games.length < 6) throw new Error('game catalog incomplete');
              await page.goto(base+'/#top', {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1500);
              if (!(await page.locator('#platform').count())) throw new Error('platform panel missing');
              // Role matrix: render the same menu as four personas without bypassing backend auth.
              const personas = [
                {name:'guest', account:null},
                {name:'member', account:{id:'ci-member',username:'member',role:'member',admin:false}},
                {name:'admin', account:{id:'ci-admin',username:'admin',role:'member',admin:true}},
                {name:'owner', account:{id:'ci-owner',username:'owner',role:'owner',admin:true}}
              ];
              for (const persona of personas) {
                await page.route(base+'/api/platform/me', async route => {
                  if (!persona.account) return route.fulfill({status:401,contentType:'application/json',body:JSON.stringify({error:'سجّل دخولك أولًا'})});
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({account:persona.account})});
                });
                await page.evaluate((hasToken) => {
                  if (hasToken) localStorage.setItem('mld_token','ci-persona-token');
                  else localStorage.removeItem('mld_token');
                }, !!persona.account);
                await page.reload({waitUntil:'domcontentloaded'});
                await page.waitForTimeout(250);
                await page.locator('#menu').click();
                const adminHidden=await page.locator('#mobile-menu [data-platform="admin"]').evaluate(el=>el.classList.contains('hidden'));
                const ownerHidden=await page.locator('#mobile-menu [data-owner]').evaluate(el=>el.classList.contains('hidden'));
                const botHidden=await page.locator('#mobile-menu [data-extra="bots"]').evaluate(el=>el.classList.contains('hidden'));
                if (persona.name==='owner') {
                  if (adminHidden||ownerHidden||botHidden) throw new Error('owner menu matrix failed');
                } else if (persona.name==='admin') {
                  if (adminHidden||!ownerHidden||!botHidden) throw new Error('admin menu matrix failed');
                } else {
                  if (!adminHidden||!ownerHidden||!botHidden) throw new Error(persona.name+' menu matrix failed');
                }
                await page.locator('#menu').click();
              }
              await page.unroute(base+'/api/platform/me');
              // The platform uses one navigation system on mobile and desktop.
              await page.locator('#menu').click();
              if (!(await page.locator('#mobile-menu.open').count())) throw new Error('unified menu did not open');
              if (await page.locator('#mobile-menu [data-login].hidden').count()) throw new Error('guest login hidden');
              if (!(await page.locator('#mobile-menu [data-platform="admin"].hidden').count())) throw new Error('admin menu visible to guest');
              if (!(await page.locator('#mobile-menu [data-owner].hidden').count())) throw new Error('owner menu visible to guest');
              await page.locator('#mobile-menu [data-platform="games"]').click();
              await page.waitForTimeout(800);
              if (!(await page.locator('.game-create').count())) throw new Error('game create buttons missing');
              // Guest must be blocked from creating a table and routed to login.
              const createButtons = page.locator('.game-create');
              const count = await createButtons.count();
              if (count !== games.games.length) throw new Error('not every catalog game has a create button');
              for (let i = 0; i < count; i++) {
                await createButtons.nth(i).click();
                await page.waitForTimeout(100);
                if (!(await page.locator('#login-user').count())) throw new Error('guest create did not require login for game '+games.games[i].id);
                await page.locator('#new-account').click();
                await page.waitForTimeout(50);
                if (!(await page.locator('#acc-user').count())) throw new Error('account view did not open');
                // Return to games for the next catalog entry.
                await page.locator('#show-login').click().catch(()=>{});
                await page.waitForTimeout(50);
                await page.goto(base+'/#top', {waitUntil:'domcontentloaded'});
                await page.waitForTimeout(500);
                await page.locator('#menu').click();
                await page.locator('#mobile-menu [data-platform="games"]').click();
                await page.waitForTimeout(300);
              }
              const lobbyApi = await page.request.get(base+'/api/platform/lobbies');
              if (!lobbyApi.ok()) throw new Error('lobbies api '+lobbyApi.status());
              const lobbyData = await lobbyApi.json();
              if (!Array.isArray(lobbyData.lobbies)) throw new Error('lobbies response invalid');
              for (const lobby of lobbyData.lobbies) {
                if ('gameState' in lobby || 'deck' in lobby || 'hands' in lobby || 'token' in lobby) {
                  throw new Error('public lobby response leaks private game state');
                }
              }
              const unauthCreate = await page.request.post(base+'/api/platform/lobbies', {data:{game:games.games[0].id,maxPlayers:games.games[0].minPlayers}});
              if (unauthCreate.status() !== 401) throw new Error('unauthenticated lobby creation was not rejected');
              await page.waitForTimeout(150);
              await browser.close();
            }
            if (failures.length) throw new Error(failures.join('\n'));
            console.log('LIVE_BROWSER_REGRESSION_OK');
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE
