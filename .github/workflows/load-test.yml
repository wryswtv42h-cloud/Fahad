name: MLD production load test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Railway
        run: |
          for i in {1..36}; do
            if curl -fsS https://discord-community-platform-production-9348.up.railway.app/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Run staged production load test
        run: node tests/load.mjs
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
