name: MLD production load and security
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Wait for production
        run: |
          for i in {1..36}; do
            if curl -fsS https://discord-community-platform-production-9348.up.railway.app/health >/dev/null; then
              echo "Production healthy"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Syntax
        run: |
          node --check index.js
          node --check public/site.js
          node --check tests/load.mjs
      - name: Security smoke
        run: npx playwright test tests/security.spec.js --reporter=line
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
      - name: Production load test
        run: node tests/load.mjs
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
          LOAD_CONCURRENCY: 1000
          LOAD_DURATION_MS: 15000
