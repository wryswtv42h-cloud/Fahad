name: Apply game turn timeout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[game-timeout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timeout logic
        shell: python
        run: |
          from pathlib import Path
          p = Path("game-engines.js")
          s = p.read_text()
          old = 'function base(game,p){return{version:4,game,phase:"playing",round:1,turnIndex:0,scores:p.map(()=>0),winner:null,lastResult:null}}'
          new = 'function base(game,p){return{version:4,game,phase:"playing",round:1,turnIndex:0,scores:p.map(()=>0),winner:null,lastResult:null,turnStartedAt:Date.now(),turnTimeoutMs:30000}}'
          if old in s and 'turnStartedAt:Date.now()' not in s:
              s = s.replace(old,new,1)
              p.write_text(s)

          p = Path("index.js")
          s = p.read_text()
          marker = 'app.get("/api/games/sessions",async(req,res)=>'
          helper = r'''const GAME_TURN_TIMEOUT_MS=Number(process.env.GAME_TURN_TIMEOUT_MS||30000);
async function processGameTimeouts(){
  try{
    const q=await pool.query("SELECT * FROM game_sessions WHERE status='playing' AND state IS NOT NULL ORDER BY id LIMIT 100");
    for(const row of q.rows){
      const db=await pool.connect();
      try{
        await db.query("BEGIN");
        const locked=await db.query("SELECT * FROM game_sessions WHERE id=$1 AND status='playing' FOR UPDATE",[row.id]);
        if(!locked.rowCount){await db.query("ROLLBACK");continue}
        const s=locked.rows[0],p=Array.isArray(s.players_json)?s.players_json:[],state=JSON.parse(JSON.stringify(s.state||{}));
        const started=Number(state.turnStartedAt||0);
        if(!started || Date.now()-started<GAME_TURN_TIMEOUT_MS){await db.query("COMMIT");continue}
        const game=String(s.game_id||"").toUpperCase();
        let actorIndex=game==="QAWSAR"?Number(state.qawsarTurn):Number(state.turnIndex);
        if(game==="CODENAMES"){
          const team=state.team==="blue"?"blue":"red";
          const wanted=team+"_"+(state.clue?"agent":"spymaster");
          actorIndex=p.findIndex(x=>state.playerRoles?.[(x?.guestId?"g:":"u:")+String(x?.username||"").toLowerCase()]===wanted);
          if(actorIndex<0){await db.query("COMMIT");continue}
        }
        const actor=p[actorIndex];
        if(!actor){await db.query("COMMIT");continue}
        let next=state;
        if(game==="CODENAMES" && !actor.bot){
          next.team=state.team==="red"?"blue":"red";
          next.clue=null;
          next.guesses=0;
          next.turnStartedAt=Date.now();
        }else if(actor.bot){
          if(game==="CODENAMES")next.turnIndex=actorIndex;
          next=games.bot(game,next,p);
          next.turnStartedAt=Date.now();
        }else{
          await db.query("COMMIT");
          continue;
        }
        const status=next.phase==="finished"?"ended":"playing";
        await db.query("UPDATE game_sessions SET state=$2::jsonb,status=$3,ended_at=CASE WHEN $3='ended' THEN NOW() ELSE ended_at END WHERE id=$1",[s.id,JSON.stringify(next),status]);
        await db.query("COMMIT");
      }catch(e){
        await db.query("ROLLBACK").catch(()=>{});
        console.error("game timeout",row.id,e.message);
      }finally{db.release()}
    }
  }catch(e){console.error("game timeout scan",e.message)}
}
setInterval(processGameTimeouts,1000);
'''
          if 'const GAME_TURN_TIMEOUT_MS=' not in s:
              s = s.replace(marker, helper + marker, 1)

          start_old = 'const state=games.create(engine,p);const x=await pool.query("UPDATE game_sessions SET status=\'playing\',started_at=NOW(),state=$2::jsonb WHERE code=$1 RETURNING *",[s.code,JSON.stringify(state)]);'
          start_new = 'const state=games.create(engine,p);state.turnStartedAt=Date.now();state.turnTimeoutMs=GAME_TURN_TIMEOUT_MS;const x=await pool.query("UPDATE game_sessions SET status=\'playing\',started_at=NOW(),state=$2::jsonb WHERE code=$1 RETURNING *",[s.code,JSON.stringify(state)]);'
          if start_old in s: s=s.replace(start_old,start_new,1)

          action_old = 'const next=games.apply(String(s.game_id||"").toUpperCase(),state,p,u,req.body.action,req.body.data||{});const status=next.phase==="finished"?"ended":"playing";'
          action_new = 'const next=games.apply(String(s.game_id||"").toUpperCase(),state,p,u,req.body.action,req.body.data||{});next.turnStartedAt=Date.now();next.turnTimeoutMs=Number(next.turnTimeoutMs||GAME_TURN_TIMEOUT_MS);const status=next.phase==="finished"?"ended":"playing";'
          if action_old in s: s=s.replace(action_old,action_new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js game-engines.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add automatic game turn timeouts [game-timeout-applied]"
          git push
