name: game-simulations
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/game-simulations.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/browser-game-smoke.spec.js --workers=1
        env:
          BASE_URL: https://discord-community-platform-production-9348.up.railway.app
