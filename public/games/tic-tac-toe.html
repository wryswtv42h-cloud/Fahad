<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--x:#f87171;--o:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:440px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
button{cursor:pointer;border:none;font-family:inherit}
.mode-bar{display:flex;gap:8px;justify-content:center;padding:14px 20px 0}
.m-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;transition:all .15s}
.m-btn.active,.m-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scores{display:flex;gap:12px;margin:14px 0 8px}
.sb{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 18px;text-align:center;min-width:60px}
.sb .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.sb .v{font-size:22px;font-weight:700}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(90vw,300px);margin-bottom:12px}
.cell{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,12vw,60px);font-weight:800;cursor:pointer;transition:background .1s}
.cell:hover:not(.taken){background:#2d3748}
.cell.x{color:var(--x);cursor:default}
.cell.o{color:var(--o);cursor:default}
.cell.win-cell{background:#312e81}
#status{font-size:16px;font-weight:600;color:#facc15;height:28px;text-align:center}
.play-btn{background:var(--accent);color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;margin-top:6px}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Tic-Tac-Toe</h1>
  <button class="play-btn" onclick="newGame()">New</button>
</header>
<div class="mode-bar">
  <button class="m-btn active" data-m="ai">vs AI</button>
  <button class="m-btn" data-m="2p">2 Players</button>
</div>
<div class="scores">
  <div class="sb"><div class="l">X</div><div class="v" id="sx">0</div></div>
  <div class="sb"><div class="l">Draw</div><div class="v" id="sd">0</div></div>
  <div class="sb"><div class="l">O</div><div class="v" id="so">0</div></div>
</div>
<div id="board"></div>
<div id="status"></div>

<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board,turn,gameOver,mode='ai',scores={x:0,d:0,o:0};

function newGame(){
  board=Array(9).fill(null);turn='X';gameOver=false;
  document.getElementById('status').textContent='';
  render();
}

function render(){
  const b=document.getElementById('board');
  b.innerHTML=board.map((v,i)=>`<div class="cell${v?' '+v.toLowerCase()+' taken':''}" data-i="${i}">${v||''}</div>`).join('');
  b.querySelectorAll('.cell').forEach(c=>{
    if(!c.classList.contains('taken'))c.addEventListener('click',()=>play(+c.dataset.i));
  });
}

function play(i){
  if(gameOver||board[i])return;
  board[i]=turn;
  const w=checkWin();
  if(w){endGame(turn,w);return;}
  if(board.every(v=>v)){endGame(null);return;}
  turn=turn==='X'?'O':'X';
  document.getElementById('status').textContent=`${turn}'s turn`;
  render();
  if(mode==='ai'&&turn==='O')setTimeout(aiMove,300);
}

function aiMove(){
  if(gameOver)return;
  const i=minimax(board,'O').idx;
  play(i);
}

function minimax(b,p,depth=0){
  const w=checkWinFor(b);
  if(w==='O')return{score:10-depth};
  if(w==='X')return{score:depth-10};
  const empty=b.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(!empty.length)return{score:0};
  const moves=empty.map(i=>{
    const nb=[...b];nb[i]=p;
    const s=minimax(nb,p==='O'?'X':'O',depth+1).score;
    return{idx:i,score:s};
  });
  return p==='O'?moves.reduce((a,m)=>m.score>a.score?m:a):moves.reduce((a,m)=>m.score<a.score?m:a);
}

function checkWin(){
  for(const[a,b,c]of LINES){
    if(board[a]&&board[a]===board[b]&&board[b]===board[c])return[a,b,c];
  }
  return null;
}

function checkWinFor(b){
  for(const[a,bv,c]of LINES){
    if(b[a]&&b[a]===b[bv]&&b[bv]===b[c])return b[a];
  }
  return null;
}

function endGame(winner,line){
  gameOver=true;
  if(winner){
    scores[winner.toLowerCase()]++;
    document.getElementById('s'+winner.toLowerCase()).textContent=scores[winner.toLowerCase()];
    document.getElementById('status').textContent=`${winner} wins!`;
    if(line){
      render();
      line.forEach(i=>document.getElementById('board').children[i].classList.add('win-cell'));
    }
  } else {
    scores.d++;
    document.getElementById('sd').textContent=scores.d;
    document.getElementById('status').textContent="It's a draw!";
  }
  setTimeout(newGame,1800);
}

document.querySelectorAll('.m-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelector('.m-btn.active').classList.remove('active');
    b.classList.add('active');mode=b.dataset.m;newGame();
  });
});

newGame();
</script>
</body>
</html>
