<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:500px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800;color:var(--text)}
.meta{display:flex;gap:12px;margin:16px 0 8px}
.score-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 18px;text-align:center;min-width:80px}
.score-box .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.score-box .val{font-size:22px;font-weight:700}
.actions{display:flex;gap:8px;margin-bottom:12px}
button{cursor:pointer;border:none;font-family:inherit;background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600}
button:hover{opacity:.85}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;width:min(95vw,440px)}
.cell{height:min(21vw,100px);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(16px,4vw,28px);transition:background .1s,color .1s;background:#334155;color:transparent}
.c2{background:#3b4f6b;color:#e2e8f0}
.c4{background:#4a5e7e;color:#e2e8f0}
.c8{background:#c2742a;color:#fff}
.c16{background:#d4612a;color:#fff}
.c32{background:#e0512a;color:#fff}
.c64{background:#e8402a;color:#fff}
.c128{background:#d4a728;color:#fff;font-size:clamp(13px,3.5vw,24px)}
.c256{background:#d4b020;color:#fff;font-size:clamp(13px,3.5vw,24px)}
.c512{background:#d4b818;color:#fff;font-size:clamp(13px,3.5vw,24px)}
.c1024{background:#d4be10;color:#fff;font-size:clamp(11px,3vw,20px)}
.c2048{background:#6366f1;color:#fff;font-size:clamp(11px,3vw,20px)}
.cbig{background:#a855f7;color:#fff;font-size:clamp(10px,2.5vw,18px)}
#msg{position:fixed;inset:0;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10}
#msg h2{font-size:36px}
#msg p{color:var(--muted)}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>2048</h1>
  <button id="shareBtn">Share</button>
</header>
<div class="meta">
  <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
  <div class="score-box"><div class="label">Best</div><div class="val" id="best">0</div></div>
</div>
<div class="actions">
  <button id="newBtn">New Game</button>
</div>
<div id="board"></div>
<div id="msg">
  <h2 id="msgTitle"></h2>
  <p id="msgSub"></p>
  <button onclick="startGame()">Play Again</button>
</div>

<script>
const SIZE=4;
let grid,score,best=+localStorage.getItem('2048-best')||0;

function startGame(){
  grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  score=0;
  addRandom();addRandom();
  document.getElementById('msg').style.display='none';
  render();
}

function addRandom(){
  const empty=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<.9?2:4;
}

function render(){
  document.getElementById('score').textContent=score;
  if(score>best){best=score;localStorage.setItem('2048-best',best);}
  document.getElementById('best').textContent=best;
  const b=document.getElementById('board');
  b.innerHTML='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const v=grid[r][c];
    const d=document.createElement('div');
    d.className='cell'+(v?(' c'+(v>2048?'big':v)):'');
    d.textContent=v||'';
    b.appendChild(d);
  }
}

function slide(row){
  let arr=row.filter(x=>x);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){score+=arr[i]*2;arr[i]*=2;arr[i+1]=0;}
  }
  arr=arr.filter(x=>x);
  while(arr.length<SIZE)arr.push(0);
  return arr;
}

function move(dir){
  let moved=false;
  const prev=grid.map(r=>[...r]);
  if(dir==='left')for(let r=0;r<SIZE;r++){const s=slide(grid[r]);if(s.join()!==grid[r].join())moved=true;grid[r]=s;}
  if(dir==='right')for(let r=0;r<SIZE;r++){const s=slide([...grid[r]].reverse()).reverse();if(s.join()!==grid[r].join())moved=true;grid[r]=s;}
  if(dir==='up')for(let c=0;c<SIZE;c++){const col=grid.map(r=>r[c]);const s=slide(col);s.forEach((v,r)=>{if(v!==col[r])moved=true;grid[r][c]=v;});}
  if(dir==='down')for(let c=0;c<SIZE;c++){const col=grid.map(r=>r[c]);const s=slide([...col].reverse()).reverse();s.forEach((v,r)=>{if(v!==col[r])moved=true;grid[r][c]=v;});}
  if(!moved)return;
  addRandom();
  render();
  checkEnd();
}

function checkEnd(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(grid[r][c]===2048){showMsg('You Win!','Score: '+score);return;}
    if(!grid[r][c])return;
  }
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return;
    if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return;
  }
  showMsg('Game Over','Score: '+score);
}

function showMsg(t,s){
  document.getElementById('msgTitle').textContent=t;
  document.getElementById('msgSub').textContent=s;
  document.getElementById('msg').style.display='flex';
}

const MAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
document.addEventListener('keydown',e=>{if(MAP[e.key]){e.preventDefault();move(MAP[e.key]);}});

let tx,ty;
document.getElementById('board').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById('board').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
});

document.getElementById('newBtn').addEventListener('click',startGame);
document.getElementById('shareBtn').addEventListener('click',()=>{
  const txt=`I scored ${score} in 2048 on oriz.games!`;
  if(navigator.share)navigator.share({title:'2048',text:txt,url:location.href});
  else navigator.clipboard.writeText(txt);
});

startGame();
</script>
</body>
</html>
